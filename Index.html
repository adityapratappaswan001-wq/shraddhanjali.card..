<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>श्रद्धांजलि – स्वर्गीय बबन पासवान</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--bg:#ece6df;--card:#f3e9e1;--red:#8e1b1b;--gold:#c9961a;--ink:#4a3a35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ece6df;--card:#f3e9e1;--red:#8e1b1b;--ink:#4a3a35}}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 20% 10%,#fff 0,var(--bg) 60%);font-family:'Noto Serif Devanagari','Tiro Devanagari Hindi',serif;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:18px 12px 40px}
.card{position:relative;width:100%;max-width:440px;background:var(--card);padding:34px 22px 40px;text-align:center;box-shadow:0 20px 50px rgba(80,50,30,.25);overflow:hidden;opacity:0;transform:scale(.9) translateY(30px);transition:all 1.4s cubic-bezier(.2,.8,.2,1)}
.card.open{opacity:1;transform:none}
.card::before,.card::after{content:"";position:absolute;inset:10px;border:2px solid transparent;border-image:linear-gradient(135deg,#4aa3c4,#e5c24a,#c9961a) 1;pointer-events:none}
.card::after{inset:16px 14px 12px 18px;transform:rotate(.6deg);opacity:.7}
.leaf{position:absolute;font-size:70px;color:var(--gold);opacity:.55;animation:sway 5s ease-in-out infinite}
.l1{top:-8px;right:-6px;transform:rotate(40deg)}.l2{bottom:-10px;left:-4px;transform:rotate(-140deg);animation-delay:1.5s}
@keyframes sway{50%{translate:4px 6px}}
h1,h2{color:var(--red);font-weight:700}
.om{font-size:22px;margin-bottom:18px}
.frame{position:relative;width:200px;margin:0 auto;padding:8px;background:linear-gradient(135deg,#f2d36b,#b8860b,#f2d36b);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:3px solid #fff3c4}
.flowers{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:34px;letter-spacing:-6px}
.rays{position:absolute;inset:-30px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.55) 0 4deg,transparent 4deg 12deg);z-index:-1;animation:spin 60s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{position:relative;display:flex;justify-content:center;margin:6px 0 10px}
.inc{position:absolute;bottom:0;width:60px;height:150px}
.inc.l{left:0}.inc.r{right:0}
.sticks{position:absolute;bottom:22px;left:50%;width:46px;height:110px;transform:translateX(-50%)}
.sticks i{position:absolute;bottom:0;left:50%;width:2px;height:100%;background:linear-gradient(#7a4a2a,#a0603a 85%,#e86a3a);transform-origin:bottom;transform:rotate(var(--r))}
.smoke{position:absolute;bottom:130px;left:50%;width:10px;height:10px;border-radius:50%;background:rgba(150,140,130,.5);filter:blur(5px);animation:rise 4s ease-out infinite}
.smoke:nth-of-type(3){animation-delay:1.3s;left:40%}.smoke:nth-of-type(4){animation-delay:2.6s;left:60%}
@keyframes rise{from{opacity:.8;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(4)}}
.bowl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:54px;height:22px;background:linear-gradient(#f2d36b,#b8860b);border-radius:4px 4px 26px 26px}
.name{margin:30px 0 4px;font-size:20px;color:var(--red);font-weight:700}
.sub{font-size:13px;opacity:.8}
.rv{opacity:0;transform:translateY(30px);transition:all 1.1s ease}.rv.in{opacity:1;transform:none}
h2{font-size:22px;margin:30px 0 12px}
p{font-size:15.5px;line-height:1.95}
.ev{margin:10px auto;padding:10px 12px;max-width:310px;border-top:1px solid rgba(201,150,26,.5);border-bottom:1px solid rgba(201,150,26,.5)}
.ev b{display:block;color:var(--red);font-size:16px}
.diyas{font-size:34px;margin-top:22px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #ffb938)}}
.call a{display:block;color:var(--ink);text-decoration:none;font-size:20px;margin:6px 0;letter-spacing:1px}
.addr{margin:18px auto 0;padding-top:14px;max-width:290px;border-top:1px solid rgba(201,150,26,.6);font-size:15px;line-height:1.9}.addr b{display:block;color:var(--red);font-size:17px;margin-bottom:2px}
.tap{position:fixed;inset:0;z-index:9;background:#ece6df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 1s,visibility 1s}
.tap.gone{opacity:0;visibility:hidden}
.tap .e{font-size:54px;animation:glow 2s infinite}
.tap button{font:inherit;font-size:17px;background:var(--red);color:#fff;border:0;border-radius:30px;padding:12px 30px;box-shadow:0 6px 18px rgba(142,27,27,.4)}
</style>
</head>
